[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight"
version = "0.1.0"
description = "PreFlight - offline evidence-first cloud-readiness review for Guidewire-style estates"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "lxml>=5.2",
  "PyYAML>=6.0",
  "ruamel.yaml>=0.18",
  "jsonschema>=4.22",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.45"]

[project.scripts]
preflight = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: browser end-to-end tests"]
